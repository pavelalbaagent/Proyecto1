<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Proyecto 1 — a static generative geometry experiment."
    />
    <meta name="theme-color" content="#f4f1e8" />
    <title>Proyecto 1 — Generative Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Proyecto 1 generative canvas">
      <canvas
        id="canvas"
        aria-label="Generative geometry canvas"
      ></canvas>

      <div class="hud">
        <div class="hud__brand">PROYECTO 1</div>

        <label class="text-control" for="text-input">
          <span class="sr-only">Text seed</span>
          <input
            id="text-input"
            type="text"
            maxlength="80"
            autocomplete="off"
            spellcheck="false"
            placeholder="TYPE SOMETHING"
            aria-label="Type text to change the geometry"
          />
        </label>

        <div class="hud__status" aria-live="polite">
          <span class="hud__status-dot"></span>
          <span id="seed-readout">SEED 00000089</span>
        </div>

        <div class="hud__hint">
          TYPE · CLICK · DRAG · ESC TO RESET
        </div>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
